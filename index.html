<body>
<!--
  이 페이지는 버전 선택용 관문입니다. 실제 청첩장은 v1/ ~ v4/ 폴더에 있습니다.
    · 주소 끝에 ?v=1 또는 ?v=2 를 붙이면 해당 버전으로 이동합니다.
    · 아무것도 붙이지 않으면 config.js 의 defaultVersion 으로 이동합니다.
  버전별 링크는 link/ 페이지에서 만들 수 있습니다.
-->
<noscript><p><a href="v1/">청첩장 보기</a></p></noscript>
<script src="config.js?v=202611170010"></script>
<script>
(function () {
  var C = window.WEDDING || {};
  var versions = (C.versions || [{ id: 1 }, { id: 2 }]).map(function (v) { return String(v.id); });
  var p = new URLSearchParams(location.search);
  var want = (p.get("v") || "").replace(/^v/i, "");
  var v = versions.indexOf(want) >= 0 ? want : String(C.defaultVersion || 1);
  p.delete("v");
  var rest = p.toString();
  location.replace("v" + v + "/" + (rest ? "?" + rest : "") + location.hash);
})();
</script>
